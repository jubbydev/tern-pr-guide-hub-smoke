name: approve
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to approve
        required: true
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr review "${{ inputs.pr }}" --approve --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
